<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Act 1 - The Pill</title>
    <link href='https://fonts.googleapis.com/css?family=Irish Grover' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Itim' rel='stylesheet'>
    <style>
        body {
            font-family: 'Itim', cursive;
            margin: 0;
            padding: 0;
            background: url("../img/bg_day.png") no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Overlay tối để chữ nổi */
            pointer-events: none;
            z-index: 1;
        }

        main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .random-title {
            font-family: 'Irish Grover', cursive;
            font-size: 80px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .random-character {
            font-family: 'Itim', cursive;
            font-size: 32px;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            opacity: 0; /* Bắt đầu ẩn để fade in */
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            will-change: opacity, transform; /* Tối ưu performance trên mobile */
        }

        .random-character.show {
            opacity: 1;
            transform: scale(1.1); /* Phóng to nhẹ khi hiện */
        }

        .random-image {
            width: 250px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            border: 3px solid #DAA520;
            opacity: 0; /* Bắt đầu ẩn */
            transform: scale(0.8) rotate(0deg); /* Bắt đầu nhỏ và xoay */
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            will-change: opacity, transform; /* Tối ưu performance trên mobile */
        }

        .random-image.show {
            opacity: 1;
            transform: scale(1) rotate(360deg); /* Kết thúc bình thường sau xoay */
        }

        .loading {
            font-size: 24px;
            color: #FFD700;
            margin-bottom: 20px;
            animation: pulse 1s infinite; /* Nhấp nháy loading */
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .random-title {
                font-size: 50px;
                letter-spacing: 1px;
            }

            .random-character {
                font-size: 24px;
            }

            .random-image {
                width: 200px; /* Giảm size trên mobile để load nhanh */
            }

            .loading {
                font-size: 20px;
            }

            /* Tối ưu animation trên mobile */
            .random-character, .random-image {
                transition-duration: 0.3s; /* Nhanh hơn trên mobile để mượt */
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 class="random-title">RANDOM TRÚNG</h1>
        <div class="loading" id="loading-text">Đang random nhân vật...</div>
        <div class="random-character" id="character-name"></div>
        <img id="character-image" class="random-image" src="" alt="Random Character">
    </main>

    <script>
        // Danh sách 6 nhân vật với tên và ảnh (thay src ảnh thật nếu có)
        const characters = [
            { name: 'NHÀ KHOA HỌC', image: '../img/Scientist.png' },
            { name: 'NHÀ BÁO', image: '../img/Journalist.png' },
            { name: 'NHÀ HOẠT ĐỘNG XÃ HỘI', image: '../img/Social_Activist.png' },
            { name: 'CÔNG NHÂN', image: '../img/Worker.png' },
            { name: 'SINH VIÊN', image: '../img/Student.png' },
            { name: 'KẺ HỢP TÁC', image: '../img/Spy.png' }
        ];

        // Random chọn 1 nhân vật cuối cùng
        const finalRandomIndex = Math.floor(Math.random() * characters.length);
        const finalSelectedCharacter = characters[finalRandomIndex];

        // Hiệu ứng 6 giây: Cycle qua các nhân vật mỗi 500ms (12 cycles trong 6s)
        let cycleIndex = 0;
        const cycleInterval = setInterval(() => {
            // Hiển thị nhân vật hiện tại trong cycle
            const currentCharacter = characters[cycleIndex % characters.length];
            document.getElementById('character-name').textContent = currentCharacter.name;
            document.getElementById('character-image').src = currentCharacter.image;

            // Thêm class show để animate mỗi lần thay đổi
            const nameEl = document.getElementById('character-name');
            const imgEl = document.getElementById('character-image');
            nameEl.classList.remove('show');
            imgEl.classList.remove('show');
            // Trigger reflow đơn giản hơn
            nameEl.style.opacity = '0.99';
            imgEl.style.opacity = '0.99';
            nameEl.classList.add('show');
            imgEl.classList.add('show');

            cycleIndex++;
        }, 500); // Mỗi 0.5s thay đổi

        // Sau 6 giây (6000ms), dừng cycle và hiển thị final
        setTimeout(() => {
            clearInterval(cycleInterval);
            document.getElementById('loading-text').style.display = 'none'; // Ẩn loading

            // Hiển thị final character với animation cuối
            document.getElementById('character-name').textContent = finalSelectedCharacter.name;
            document.getElementById('character-image').src = finalSelectedCharacter.image;

            const nameEl = document.getElementById('character-name');
            const imgEl = document.getElementById('character-image');
            nameEl.classList.remove('show');
            imgEl.classList.remove('show');
            nameEl.style.opacity = '0.99';
            imgEl.style.opacity = '0.99';
            nameEl.classList.add('show');
            imgEl.classList.add('show');

            // Sau khi hiển thị final, chờ thêm 3 giây rồi chuyển trang
            setTimeout(() => {
                window.location.href = './act_2.html'; // Chuyển sang act_2.html
            }, 2000);
        }, 5000);
    </script>
</body>
</html>
