<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Số - The Pill</title>
    <link href='https://fonts.googleapis.com/css?family=Itim' rel='stylesheet'>
    <style>
        body {
            font-family: 'Itim', cursive;
            margin: 0;
            padding: 0;
            background: url("../img/point.png")
             no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 1;
        }

        main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            gap: 30px;
        }

        .scores-display {
            font-size: 32px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            color:rgba(236, 211, 173, 1);
            font-family: 'Lalezar', sans-serif;
            font-weight: regular;
            font-size: 48px;
        }

        .back-btn {
            background: rgba(101, 77, 53, 0.9);
            color: #fff;
        
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(165, 42, 42, 0.9);
        }

        .win-message {
            font-size: 40px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <main>
        <div class="win-message" id="win-message" style="display: none;"></div>
        <div class="scores-display" id="scores-text">Điểm: Bạn 0 - AI 0</div>
        <button id="back-btn" class="back-btn" onclick="backToAct2()">Tiếp Tục Chơi</button>
    </main>

    <script>
        function getScores() {
            const stored = localStorage.getItem('gameScores');
            if (!stored) {
                return { player: 0, ai: 0 }; // Mặc định 0 nếu chưa có
            }
            return JSON.parse(stored);
        }

        function checkWin(scores) {
            if (scores.player >= 3) {
                document.getElementById('win-message').textContent = 'Bạn thắng!';
                document.getElementById('win-message').style.display = 'block';
                document.getElementById('back-btn').style.display = 'none'; // Ẩn nút
                // Chuyển sang act_3.html sau 2s
                setTimeout(() => {
                    window.location.href = './act_3.html';
                }, 1000);
                return true;
            } else if (scores.ai >= 3) {
                document.getElementById('win-message').textContent = 'AI thắng!';
                document.getElementById('win-message').style.display = 'block';
                document.getElementById('back-btn').style.display = 'none'; // Ẩn nút
                // Chuyển sang act_3.html sau 2s
                setTimeout(() => {
                    window.location.href = './act_3.html';
                }, 2000);
                return true;
            }
            return false;
        }

        // Hiển thị scores
        const scores = getScores();
        document.getElementById('scores-text').textContent = `Điểm: Bạn ${scores.player} - AI ${scores.ai}`;
        checkWin(scores);

        function backToAct2() {
            window.location.href = './act_2.html';
        }
    </script>
</body>
</html>
