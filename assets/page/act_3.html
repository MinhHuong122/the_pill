<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thắng Thua - The Pill</title>
    <link href='https://fonts.googleapis.com/css?family=Itim' rel='stylesheet'>
    <style>
        body {
            font-family: 'Itim', cursive;
            margin: 0;
            padding: 0;
            background: url("../img/bg_night.png") no-repeat center center fixed; /* Nền mặc định đêm */
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            transition: background-image 1s ease-in-out; /* Chuyển mượt */
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Overlay tối để chữ nổi, điều chỉnh nếu cần */
            pointer-events: none;
            z-index: 1;
            transition: background 1s ease-in-out; /* Chuyển mượt overlay */
        }

        body.win {
            background: url("../img/bg_day.png") no-repeat center center fixed; /* Nền ngày khi thắng */
        }

        body.win::before {
            background: rgba(0, 0, 0, 0.2); /* Overlay sáng hơn khi thắng */
        }

        body.lose {
            background: url("../img/bg_night.png") no-repeat center center fixed; /* Giữ đêm khi thua */
        }

        body.lose::before {
            background: rgba(0, 0, 0, 0.6); /* Overlay tối hơn khi thua */
        }

        main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            gap: 30px;
            padding: 20px;
        }

        .win-lose-message {
            font-size: 48px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            line-height: 1.4;
            max-width: 80%;
        }

        .win-message {
            color: #90EE90; /* Xanh lá cho thắng */
        }

        .lose-message {
            color: #FFB6C1; /* Hồng cho thua */
        }

        .home-btn {
            background: rgba(101, 77, 53, 0.9); /* Nâu giống nút trong game */
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Itim', cursive;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .home-btn:hover {
            background: rgba(165, 42, 42, 0.9);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .win-lose-title {
                font-size: 28px;
            }

            .win-lose-message {
                font-size: 22px;
            }

            .home-btn {
                font-size: 18px;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="win-lose-message" id="win-lose-text"></div>
        <button class="home-btn" onclick="goHome()">Trở Về Trang Chủ</button>
    </main>

    <script>
        function getScores() {
            const stored = localStorage.getItem('gameScores');
            if (!stored) {
                return { player: 0, ai: 0 };
            }
            return JSON.parse(stored);
        }

        // Kiểm tra thắng thua
        const scores = getScores();
        const messageEl = document.getElementById('win-lose-text');
        const bodyEl = document.body;

        if (scores.player >= 3) {
            messageEl.textContent = 'CHÚC MỪNG BẠN ĐÃ THÀNH CÔNG ĐÁNH BẠI A.I VÀ THỂ HIỆN ĐƯỢC GIÁ TRỊ RIÊNG CỦA BẢN THÂN.';
            messageEl.classList.add('win-message');
            bodyEl.classList.add('win'); // Thêm class win để đổi background ngày
        } else if (scores.ai >= 3) {
            messageEl.textContent = 'A.I ĐÃ DÀNH CHIẾN THẮNG. BẠN CẦN CỐ GẮNG HƠN NỮA ĐỂ THỂ HIỆN GIÁ TRỊ CỦA MÌNH.';
            messageEl.classList.add('lose-message');
            bodyEl.classList.add('lose'); // Thêm class lose để giữ/đổi background đêm
        } else {
            messageEl.textContent = 'Trò chơi kết thúc!'; // Fallback
        }

        // Reset scores và về trang chủ
        function goHome() {
            localStorage.removeItem('gameScores');
            window.location.href = '/the_pill'; // Về trang chủ
        }
    </script>
</body>
</html>
