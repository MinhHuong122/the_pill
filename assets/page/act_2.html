<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Act 2 - The Pill</title>
    <link href='https://fonts.googleapis.com/css?family=Irish Grover' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Itim' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Lalezar' rel='stylesheet'>
    <style>
        body {
            font-family: 'Lalezar', sans-serif;
            margin: 0;
            padding: 0;
            background: url("../img/bg_night.png") no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Overlay tối để chữ nổi */
            pointer-events: none;
            z-index: 1;
        }

        main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            gap: 50px;
        }

        h1 {
            font-family: 'Itim', cursive;
            font-size: 48px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-align: center;
        }

        .choice-buttons {
            display: flex;
            justify-content: space-around;
            width: 80%;
            max-width: 700px; /* Tăng max-width để nút rộng hơn */
            gap: 50px; /* Giảm gap để cân bằng */
        }

        .choice-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1; /* Làm hai wrapper bằng nhau */
            max-width: 250px; /* Giới hạn width để nút đều */
            opacity: 0;
            transform: translateY(100px); /* Bắt đầu từ dưới */
            animation: slideUp 1s ease-out forwards; /* Animation chạy lên */
        }

        .choice-wrapper:nth-child(1) {
            animation-delay: 0.5s; /* Delay cho bên trái */
        }

        .choice-wrapper:nth-child(2) {
            animation-delay: 1s; /* Delay cho bên phải */
        }

        .choice-icon {
            width:100px;
            height:100px;
            margin-bottom: 10px; /* Sửa lỗi từ 10x */
            object-fit: cover; /* Giữ tỷ lệ icon */
        }

        .choice-btn {
            background: rgba(101, 77, 53, 1); /* Nâu từ hình */
            color: #fff;
            border: none;
            padding: 20px 30px; /* Padding đều để nút vuông hơn */
            font-size: 18px; /* Giảm font để text ngắn hơn */
            font-weight: bold;
            border-radius: 50px; /* Bo tròn giống nút hình */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            width: 100%; /* Full width của wrapper để đều size */
            white-space: nowrap; /* Không xuống dòng text */
        }

        .choice-btn:hover {
            background: rgba(165, 42, 42, 0.9); /* Tối hơn khi hover */
            transform: translateY(-5px); /* Nhấc lên khi hover */
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0); /* Chạy lên vị trí bình thường */
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
                letter-spacing: 1px;
            }

            .choice-buttons {
                flex-direction: column; /* Xếp dọc trên mobile */
                gap: 30px;
                width: 90%;
            }

            .choice-wrapper {
                max-width: 100%;
                animation-delay: 0.5s; /* Không delay riêng trên mobile */
            }

            .choice-btn {
                font-size: 16px;
                padding: 15px 20px;
            }

            .choice-icon {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>BẠN LỰA CHỌN ...</h1>
        <div class="choice-buttons">
            <div class="choice-wrapper">
                <img src="../img/AI.png" alt="AI Icon" class="choice-icon">
                <!-- Thay src bằng ảnh thật -->
                <button class="choice-btn" onclick="chooseOption('theo')">CHỐNG LẠI AI</button>
            </div>
            <div class="choice-wrapper">
                <img src="../img/AI.png" alt="AI Icon" class="choice-icon">
                <!-- Thay src bằng ảnh thật -->
                <button class="choice-btn" onclick="chooseOption('chong')">NGHE THEO AI</button>
            </div>
        </div>
    </main>

    <script>
        // Khởi tạo scores nếu chưa có
        if (!localStorage.getItem('gameScores')) {
            localStorage.setItem('gameScores', JSON.stringify({ player: 0, ai: 0 }));
        }

        function getScores() {
            return JSON.parse(localStorage.getItem('gameScores'));
        }

        function updateScores(newScores) {
            localStorage.setItem('gameScores', JSON.stringify(newScores));
        }

        function checkWin(scores) {
            if (scores.player >= 3) {
                alert('Bạn thắng! Đạt 3 điểm.');
                localStorage.removeItem('gameScores');
                window.location.href = 'index.html';
                return true;
            } else if (scores.ai >= 3) {
                alert('AI thắng! Họ đạt 3 điểm.');
                localStorage.removeItem('gameScores');
                window.location.href = 'index.html';
                return true;
            }
            return false;
        }

        function chooseOption(option) {
            const scores = getScores();
            if (checkWin(scores)) return; // Kiểm tra win trước khi chơi

            if (option === 'theo') {
                window.location.href = './quiz.html'; // Chuyển sang quiz
            } else {
                window.location.href = './event.html'; // Chuyển sang random event
            }
        }
    </script>
</body>
</html>
